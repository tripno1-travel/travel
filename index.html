function card(d){return '<div class="card" onclick="cardClick(event,'+d.n+')">'+(d.img?'<img src="'+d.img+'" loading="lazy" alt="">':'<div class="ph">'+d.ci+' · '+d.c+'</div>')+'<div class="bd"><div class="tags"><span>'+d.c+'</span><span>'+d.ci+'</span><span>'+d.ty+'</span></div><div class="ti">'+d.t+'</div><div class="btns">'+(d.aff?'<a class="buy" target="_blank" rel="sponsored nofollow" href="'+d.aff+'">예약하기</a>':'')+'<a class="rev" target="_blank" href="'+d.url+'">후기 보러 가기</a></div></div></div>'}
function grp(items,key){const m=new Map();items.forEach(d=>{const k=d[key];if(!k||k=='기타'||k=='전체')return;if(!m.has(k))m.set(k,{n:0,img:''});const g=m.get(k);g.n++;if(!g.img&&d.img)g.img=d.img});return [...m.entries()].sort((a,b)=>b[1].n-a[1].n)}
function dcard(k,g,fn){return '<div class="dcard" onclick="'+fn+'(\''+k+'\')">'+(g.img?'<img src="'+g.img+'" loading="lazy" alt="">':'')+'<div class="lb">'+k+'<small>'+g.n+'개 글</small></div></div>'}
function show(id){['home','listview'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!=id));window.scrollTo(0,0)}
function regionCards(el,items){document.getElementById(el).innerHTML=grp(items,'rg').map(([k,g])=>dcard(k,g,'openRegion')).join('')}

 document.getElementById('dtitle').textContent=rg;document.getElementById('destgrid').innerHTML=grp(items,overseas?'c':'ci').map(([k,g])=>dcard(k,g,overseas?'openCountry':'openCity')).join('');
 document.getElementById('allbtn').onclick=()=>openPosts(items,rg+' 전체 글','ty');setPosts(items);show('listview')}
function openCountry(c){const items=D.filter(d=>d.c==c);document.getElementById('dtitle').textContent=c+' 여행';

function openPosts(list,title,sk){document.getElementById('dtitle').textContent=title;document.getElementById('destgrid').innerHTML='';document.getElementById('allbtn').onclick=null;cur=list;shown=24;renderSub('전체',sk);show('listview')}
function renderSub(sel,sk){if(sk)subkey=sk;const el=document.getElementById('subchips');const vals=['전체',...new Set(cur.map(d=>d[subkey]))];el.innerHTML=vals.map(v=>'<button class="chip'+(v==sel?' on':'')+'" onclick="renderSub(\''+v+'\');draw()">'+v+'</button>').join('');sublist=sel=='전체'?cur:cur.filter(d=>d[subkey]==sel);draw()}
function draw(){document.getElementById('lcount').textContent='총 '+sublist.length+'개';document.getElementById('lgrid').innerHTML=sublist.slice(0,shown).map(card).join('');document.getElementById('morebtn').classList.toggle('hide',shown>=sublist.length)}
function more(){shown+=24;draw()}
function goHome(){show('home')}
function goSearch(){const v=document.getElementById('q').value.trim();if(!v)return;document.getElementById('destgrid').innerHTML='';openPosts(D.filter(d=>d.t.includes(v)),'"'+v+'" 검색 결과','c')}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key=='Enter')goSearch()});

const _openPosts=openPosts;
openPosts=function(list,title,sk){document.getElementById('allbtn').style.display='';if(title=='숙소'){openLodging();return} if(title=='투어·티켓'){openTyped('투어·티켓');return} if(title=='축제·명소'){_openPosts(list,title,'rg');return}_openPosts(list,title,sk)};
const RORDER=['서울','경기','인천','강원','충청','전라','경상','제주','기타 지역'];
(()=>{const el=document.getElementById('domestic');el.innerHTML=grp(D.filter(d=>d.s=='국내'),'rg').sort((a,b)=>RORDER.indexOf(a[0])-RORDER.indexOf(b[0])).map(([k,g])=>dcard(k,g,'openRegion')).join('')})();
function drawL(){document.getElementById('lcount').textContent='총 '+sublist.length+'개';document.getElementById('lgrid').innerHTML=sublist.slice(0,shown).map(card).join('');document.getElementById('morebtn').classList.toggle('hide',shown>=sublist.length)}
function setL(it){cur=it;sublist=it;shown=24;drawL()}
function openLodging(){const all=D.filter(d=>d.ty=='숙소');document.getElementById('dtitle').textContent='숙소';document.getElementById('subchips').innerHTML='';document.getElementById('allbtn').style.display='none';
document.getElementById('destgrid').innerHTML=['국내','해외'].map(sc=>{const it=all.filter(d=>d.s==sc);const img=(it.find(d=>d.img)||{}).img||'';return '<div class="dcard" onclick="openLodScope(\''+sc+'\')">'+(img?'<img src="'+img+'" loading="lazy" alt="">':'')+'<div class="lb">'+sc+' 숙소<small>'+it.length+'개 글</small></div></div>'}).join('');
setL(D.filter(d=>d.ty==document.getElementById('dtitle').textContent));show('listview')}
function gamCard(sc){const it=D.filter(d=>d.gm&&d.s==sc);return '<div class="dcard" onclick="openGamseong(\''+sc+'\')"><div class="lb">감성 숙소<small>'+it.length+'개 글</small></div></div>'}
function openLodScope(sc){const it=D.filter(d=>d.ty=='숙소'&&d.s==sc);document.getElementById('dtitle').textContent='숙소 · '+sc;document.getElementById('subchips').innerHTML='';document.getElementById('allbtn').style.display='none';
if(sc=='국내'){document.getElementById('destgrid').innerHTML=grp(it,'rg').sort((a,b)=>RORDER.indexOf(a[0])-RORDER.indexOf(b[0])).map(([k,g])=>dcard(k,g,'openLodRegion')).join('')+gamCard(sc)}
else{const ord={'일본':0,'태국':1};document.getElementById('destgrid').innerHTML=grp(it,'c').sort((a,b)=>(ord[a[0]]??9)-(ord[b[0]]??9)||b[1].n-a[1].n).map(([k,g])=>dcard(k,g,'openLodCountry')).join('')+gamCard(sc)}
setL(it);show('listview')}
function openLodRegion(rg){document.getElementById('allbtn').style.display='none';_openPosts(D.filter(d=>d.ty=='숙소'&&d.s=='국내'&&d.rg==rg),'국내 숙소 · '+rg,'ci')}
function openLodCountry(c){document.getElementById('allbtn').style.display='none';_openPosts(D.filter(d=>d.ty=='숙소'&&d.c==c),'해외 숙소 · '+c,'ci')}
function openGamseong(sc){const it=D.filter(d=>d.gm&&d.s==sc);document.getElementById('dtitle').textContent='감성 숙소';document.getElementById('destgrid').innerHTML='';document.getElementById('subchips').innerHTML='';
if(it.length){setL(it)}else{document.getElementById('lcount').textContent='아직 등록된 감성 숙소가 없어요. 준비 중인 카테고리예요.';document.getElementById('lgrid').innerHTML='';document.getElementById('morebtn').classList.add('hide')}show('listview')}



function scopeCards(ty){return ['국내','해외'].map(sc=>{const it=D.filter(d=>d.ty==ty&&d.s==sc);const img=(it.find(d=>d.img)||{}).img||'';return '<div class="dcard" onclick="openTypedScope(\''+ty+'\',\''+sc+'\')">'+(img?'<img src="'+img+'" loading="lazy" alt="">':'')+'<div class="lb">'+sc+'<small>'+it.length+'개 글</small></div></div>'}).join('')}
function openTyped(ty){document.getElementById('dtitle').textContent=ty;document.getElementById('subchips').innerHTML='';document.getElementById('allbtn').style.display='none';document.getElementById('destgrid').innerHTML=scopeCards(ty);setL(D.filter(d=>d.ty==document.getElementById('dtitle').textContent));show('listview')}
function openTypedScope(ty,sc){const it=D.filter(d=>d.ty==ty&&d.s==sc);document.getElementById('dtitle').textContent=ty+' · '+sc;document.getElementById('subchips').innerHTML='';document.getElementById('allbtn').style.display='none';
if(sc=='국내'){document.getElementById('destgrid').innerHTML=grp(it,'rg').sort((a,b)=>RORDER.indexOf(a[0])-RORDER.indexOf(b[0])).map(([k,g])=>dcard(k,g,'openTypedRegion')).join('')}
else{const ord={'일본':0,'태국':1};document.getElementById('destgrid').innerHTML=grp(it,'c').sort((a,b)=>(ord[a[0]]??9)-(ord[b[0]]??9)||b[1].n-a[1].n).map(([k,g])=>dcard(k,g,'openTypedCountry')).join('')}
cur=it;sublist=it;shown=24;drawL();show('listview')}
let _ty='';
function openTypedRegion(rg){document.getElementById('allbtn').style.display='none';const ty=document.getElementById('dtitle').textContent.split(' · ')[0];_openPosts(D.filter(d=>d.ty==ty&&d.s=='국내'&&d.rg==rg),'국내 '+ty+' · '+rg,'ci')}
function openTypedCountry(c){document.getElementById('allbtn').style.display='none';const ty=document.getElementById('dtitle').textContent.split(' · ')[0];_openPosts(D.filter(d=>d.ty==ty&&d.c==c),'해외 '+ty+' · '+c,'ci')}
</script>
<div id="detail" style="display:none;position:fixed;inset:0;background:#fff;z-index:50;overflow-y:auto">
 <div style="max-width:820px;margin:0 auto;padding:18px 18px 60px">
  <button onclick="closeDetail()" style="border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 16px;font-size:15px;cursor:pointer">← 목록으로</button>
  <img id="dImg" referrerpolicy="no-referrer" style="width:100%;border-radius:14px;margin-top:14px" alt="">
  <h1 id="dTtl" style="font-size:24px;line-height:1.4;margin:16px 0 6px"></h1>
  <div id="dMeta" style="color:#888;font-size:14px"></div>
  <div id="dKw" style="margin:12px 0"></div>
  <p id="dDesc" style="font-size:16.5px;line-height:1.75;color:#222;white-space:pre-wrap"></p>
  <div id="dBtns" style="display:flex;gap:10px;margin-top:22px"></div>
 </div>
</div>
<script>
function openDetail(o){const d=document.getElementById('detail');document.getElementById('dImg').src=o.img||'';document.getElementById('dImg').alt=o.t;document.getElementById('dTtl').textContent=o.t;document.getElementById('dMeta').textContent=((o.c&&o.rg&&o.c!==o.rg)?o.c+' · '+o.rg:(o.c||o.rg||''))+' · '+(o.ty||'');document.getElementById('dKw').innerHTML=(o.kw||[]).map(k=>'<span style="display:inline-block;background:#eef4ff;color:#2456c4;border-radius:999px;padding:4px 11px;font-size:13px;margin:0 5px 5px 0">#'+k+'</span>').join('');document.getElementById('dDesc').textContent=o.ds||'';let b='';if(o.aff)b+='<a href="'+o.aff+'" target="_blank" rel="sponsored noopener" style="flex:1;text-align:center;background:#e8342e;color:#fff;padding:14px;border-radius:10px;font-weight:700;text-decoration:none;font-size:16px">예약하기</a>';b+='<a href="'+o.url+'" target="_blank" rel="noopener" style="flex:1;text-align:center;background:#03c75a;color:#fff;padding:14px;border-radius:10px;font-weight:700;text-decoration:none;font-size:16px">후기 보러 가기</a>';document.getElementById('dBtns').innerHTML=b;d.style.display='block';document.body.style.overflow='hidden';history.replaceState(null,'','#d'+o.n);window.scrollTo(0,0);d.scrollTop=0}
function closeDetail(){document.getElementById('detail').style.display='none';document.body.style.overflow='';history.replaceState(null,'',' ')}
window.addEventListener('DOMContentLoaded',()=>{const h=location.hash;if(h.startsWith('#d')){const o=D.find(x=>'d'+x.n===h);if(o)openDetail(o)}});
</script>
<details style="max-width:1100px;margin:30px auto;padding:0 16px"><summary style="cursor:pointer;color:#666;font-size:14px">전체 여행 상품 안내</summary><div id="seoList" style="color:#555;font-size:13.5px;line-height:1.8;margin-top:12px"></div></details>
<script>document.getElementById('seoList').innerHTML=D.map(o=>'<p><b>'+o.t+'</b> ('+(o.rg||'')+' · '+(o.ty||'')+')<br>'+(o.ds||'')+'</p>').join('');</script>
<script>function cardClick(e,n){if(e.target.closest('a'))return;const o=D.find(x=>x.n==n);if(o)openDetail(o)}</script>
</body></html>
